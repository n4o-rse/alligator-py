[project]
name = "alligator-py"
version = "0.1.0"
description = "Allen transformer — Python port of the LEIZA alligator tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Florian Thiery" },
    { name = "Allard W. Mees" },
]
keywords = ["Linked Open Data", "Allen Interval Algebra", "Relative Chronology"]
dependencies = [
    "rdflib>=7.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
amt = ["pyshacl>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/n4o-rse/alligator-py"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# A verbatim copy of leiza-scit/CAA2026-alligator/py/wd_repro.py. Kept byte-for-
# byte so the two can be diffed; any change belongs upstream first.
"py/wd_repro.py" = ["EXE001", "UP031", "DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
