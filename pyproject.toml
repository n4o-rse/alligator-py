[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alligator-py"
version = "0.1.0"
description = "Allen transformer — Python port of the LEIZA alligator tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Florian Thiery" },
    { name = "Allard W. Mees" },
]
keywords = ["Linked Open Data", "Allen Interval Algebra", "Relative Chronology"]
dependencies = [
    "rdflib>=7.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
# AMT.engine, for the optional `amt` phase (step S6). Pinned to a commit
# rather than a tag because the repository has none; re-pin when it releases.
# The engine brings rdflib, pyshacl and pyvis itself.
amt = [
    "amt @ git+https://github.com/n4o-rse/amt-engine.git@968e80ea1e66a110276f4255625edec10dace49c",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/n4o-rse/alligator-py"

# Nothing here is importable as a library: the pipeline is run as
# `python py/main.py`, and `py/` is put on the path at runtime. Without this,
# setuptools' flat-layout discovery finds `py`, `data`, `output` and
# `reference` and refuses to build -- which made `pip install -e ".[amt]"`,
# the only way to get the optional extra, impossible.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# A verbatim copy of leiza-scit/CAA2026-alligator/py/wd_repro.py. Kept byte-for-
# byte so the two can be diffed; any change belongs upstream first.
"py/wd_repro.py" = ["EXE001", "UP031", "DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
